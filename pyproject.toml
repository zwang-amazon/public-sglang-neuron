[project]
name = "sglang-neuron-demo"
version = "0.0.1"
description = "Synthetic package for a development-flow demo"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
markers = ["neuron: needs a NeuronCore"]
